<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Drive key test</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.45}input,button{font:inherit;padding:10px}input{width:min(100%,520px)}button{margin-top:12px}pre{white-space:pre-wrap;background:#f4f4f4;padding:14px;border-radius:8px}.ok{color:#087a34}.bad{color:#b00020}
  </style>
</head>
<body>
  <h1>Drive API key test</h1>
  <p>This page does not save the key. Enter it once here to verify public folder listing and media download from this GitHub Pages origin.</p>
  <input id="key" type="password" autocomplete="off" placeholder="AIza…" />
  <br><button id="run" type="button">Run test</button>
  <pre id="out">Not tested.</pre>
<script>
(() => {
  const folders = [
    ['Parents Player', '1LkvFEALAV1penT439jh5NyM7ilsG9TC6'],
    ['Dad\'s Music', '1c7Dj_Dnysp8YSIO4QQqUJ-fLA4nbqTec']
  ];
  const out = document.getElementById('out');
  const keyInput = document.getElementById('key');
  const button = document.getElementById('run');

  async function testFolder(label, folderId, key) {
    const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
    const fields = encodeURIComponent('files(id,name,mimeType,size,modifiedTime)');
    const listUrl = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&pageSize=20&key=${encodeURIComponent(key)}`;
    const listResponse = await fetch(listUrl);
    const listText = await listResponse.text();
    if (!listResponse.ok) throw new Error(`${label}: list failed ${listResponse.status} ${listText.slice(0,300)}`);
    const json = JSON.parse(listText);
    const audio = (json.files || []).find(f => String(f.mimeType || '').startsWith('audio/'));
    if (!audio) throw new Error(`${label}: folder listed but no audio file was returned`);

    const mediaUrl = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(audio.id)}?alt=media&key=${encodeURIComponent(key)}`;
    const mediaResponse = await fetch(mediaUrl, { headers: { Range: 'bytes=0-1023' } });
    if (!mediaResponse.ok && mediaResponse.status !== 206) {
      const body = await mediaResponse.text().catch(() => '');
      throw new Error(`${label}: media failed ${mediaResponse.status} ${body.slice(0,300)}`);
    }
    const blob = await mediaResponse.blob();
    if (!blob.size) throw new Error(`${label}: media response was empty`);
    return `${label}: PASS — listed ${(json.files || []).length} item(s); downloaded ${blob.size} byte(s) from ${audio.name}`;
  }

  button.addEventListener('click', async () => {
    const key = keyInput.value.trim();
    if (!/^AIza[\w-]{20,}$/.test(key)) {
      out.className = 'bad'; out.textContent = 'Enter the API key that starts with AIza.'; return;
    }
    button.disabled = true;
    out.className = '';
    out.textContent = 'Testing…';
    try {
      const results = [];
      for (const [label, folderId] of folders) results.push(await testFolder(label, folderId, key));
      out.className = 'ok';
      out.textContent = results.join('\n');
    } catch (error) {
      out.className = 'bad';
      out.textContent = `FAIL — ${error.message || error}`;
    } finally {
      keyInput.value = '';
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
