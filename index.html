<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json?v=6" />
  <link rel="icon" href="app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="app-icon.png" />
  <link rel="stylesheet" href="styles.css?v=11" />
  <link rel="stylesheet" href="background.css?v=1" />
  <link rel="stylesheet" href="playlist.css?v=4" />
  <title>불교경전</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">오프라인 재생</div><div class="title-row"><h1>불교경전</h1></div></div>
      <div class="top-actions">
        <button id="settingsBtn" class="icon-btn" type="button" aria-label="설정" style="width:24px;height:24px;min-height:24px;border:0;background:transparent;border-radius:8px;padding:0;margin-right:3px;color:var(--muted);opacity:.72"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0-.73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        <button id="syncBtn" class="sync-btn" type="button">불경 업데이트</button>
      </div>
    </header>
    <section class="status-card" aria-live="polite"><div id="statusTitle" class="status-title">저장된 목록을 불러오는 중…</div><div id="statusDetail" class="status-detail"></div></section>
    <main><div class="section-head"><h2>전체</h2><div id="trackCount" class="track-count">0개</div></div><div id="trackList" class="track-list"></div><div id="emptyState" class="empty-state hidden">아직 저장된 불경이 없습니다.</div></main>
  </div>

  <section id="player" class="player hidden" aria-label="재생 중">
    <div class="now-row"><div class="now-copy"><div id="nowTitle" class="now-title">—</div><div id="nowStatus" class="now-status">—</div></div><div class="player-options"><div class="speed-control" role="group" aria-label="재생 속도"><button id="speed1Btn" class="speed-btn active" type="button">1배</button><button id="speed2Btn" class="speed-btn" type="button">2배</button></div><button id="repeatBtn" class="repeat-btn" type="button" aria-label="전체 반복">↻ 전체</button></div></div>
    <div class="seek-wrap"><input id="seek" class="seek" type="range" min="0" max="1000" value="0" /><div class="seek-times"><span id="timeCurrent">0:00</span><span id="timeTotal">0:00</span></div></div>
    <div class="controls"><button id="prevBtn" class="control-btn" type="button" aria-label="이전 불경"><span class="skip-icon skip-prev" aria-hidden="true"><span class="skip-bar"></span><span class="skip-triangle"></span></span></button><button id="playBtn" class="play-btn" data-state="play" type="button" aria-label="재생"></button><button id="nextBtn" class="control-btn" type="button" aria-label="다음 불경"><span class="skip-icon skip-next" aria-hidden="true"><span class="skip-triangle"></span><span class="skip-bar"></span></span></button></div>
    <button id="backBtn" class="hidden" type="button" tabindex="-1" aria-hidden="true"></button><button id="forwardBtn" class="hidden" type="button" tabindex="-1" aria-hidden="true"></button>
  </section>

  <dialog id="settingsDialog" class="dialog settings-dialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-title">설정</div>
      <section class="settings-section settings-first">
        <div class="settings-section-title">저장공간</div>
        <div class="settings-row"><span class="settings-row-label">오프라인 오디오</span><span id="offlineStats" class="settings-row-value">0개 · 0 MB</span></div>
        <div class="settings-row"><span class="settings-row-label">브라우저 저장공간</span><span id="storageEstimate" class="settings-row-value">계산 중…</span></div>
        <div class="settings-storage-actions"><button id="deleteOfflineBtn" type="button" class="button secondary full-width">모든 오프라인 오디오 삭제</button></div>
        <p id="storageResult" class="settings-storage-result"></p>
      </section>
      <section class="settings-section">
        <div class="settings-section-title">Google Drive</div>
        <div class="settings-row"><span class="settings-row-label">연결 상태</span><span id="driveStorageStatus" class="settings-row-value">확인 중…</span></div>
        <label class="field"><span>Google Drive API 키</span><input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" /></label>
        <button id="saveSettingsBtn" type="button" class="button secondary full-width">API 키 저장</button>
      </section>
      <details class="settings-section settings-advanced">
        <summary>고급 설정</summary>
        <label class="field"><span>Google Drive 폴더 ID</span><input id="folderIdInput" type="text" autocomplete="off" /></label>
        <button type="button" class="button secondary full-width" onclick="document.getElementById('saveSettingsBtn').click()">폴더 설정 저장</button>
      </details>
      <details class="settings-section settings-troubleshooting"><summary>문제 해결</summary><button id="factoryResetBtn" type="button" class="danger-btn">이 기기에서 불경 듣기 초기화</button></details>
      <div class="dialog-actions"><button value="cancel" class="button secondary">닫기</button></div>
    </form>
  </dialog>

  <audio id="audio" preload="metadata" playsinline></audio>
  <script src="audio-storage.js?v=2"></script>
  <script src="reliability-guard.js?v=2" defer></script>
  <script src="playlist.js?v=2" defer></script>
  <script src="app.js?v=6" defer></script>
  <script src="playback-policy.js?v=1" defer></script>
  <script src="ui-fixes.js?v=2" defer></script>
</body>
</html>
